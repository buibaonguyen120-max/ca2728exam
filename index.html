<style>
:root{--bg:#faf5f1;--card:#fff;--ink:#2b2327;--mut:#85797f;--pri:#c0305a;--pri2:#e0527a;--tint:#fcebf0;--line:#efe5df;--warn:#fdf3d4;--y:#f7de80;--g:#a9e0b2;--b:#9fcaf3;--p:#f5b3d0;--sh:0 1px 2px #2b232710,0 10px 28px #2b23271c;--r:18px}
@media(prefers-color-scheme:dark){:root{--bg:#1b1518;--card:#272024;--ink:#f3eaec;--mut:#a99ca2;--tint:#3b2330;--line:#3a2e34;--warn:#4a3d1a;--sh:0 10px 28px #0007}}
html,body{height:100%;margin:0}*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 Lexend,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{min-height:100%;display:flex;flex-direction:column}button,input,select,textarea{font:inherit;color:inherit}h1,h2{margin:.2em 0}
.wrap{width:100%;max-width:700px;margin:4vh auto;padding:0 16px;display:grid;gap:14px}.hero{text-align:center;padding:30px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh)}
.logo{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));display:inline-grid;place-items:center}.logo.big{width:68px;height:68px;font-size:32px;margin-bottom:10px}
.btn{border:0;background:transparent;border-radius:99px;padding:9px 16px;cursor:pointer;transition:.15s;white-space:nowrap}.btn:hover{background:var(--bg)}.btn:active{scale:.95}.btn:disabled{opacity:.35}.btn.on{background:var(--tint);color:var(--pri)}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-weight:600;box-shadow:0 5px 14px #c0305a55}.btn.lg{padding:13px 28px;font-size:16px;margin-top:12px}
input[type=text],input[type=datetime-local],select,textarea{border:1.5px solid var(--line);border-radius:10px;padding:7px 11px;background:var(--card)}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px #c0305a22}
.hint{font-size:12px;color:var(--mut)}.badc{color:#b32323}.okc{color:#1c7a3a}.top2{display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);margin:6px 0;cursor:pointer}.grow{flex:1;min-width:0}
.pill{display:inline-flex;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:500;background:var(--bg);border:1px solid var(--line);color:var(--mut)}.pill.r{background:#fde3ea;color:#b0254c;border:0}.pill.v{background:#e5e3fb;color:#4b43b3;border:0}.pill.w{background:#fdeed0;color:#8a5a00;border:0}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 22px;gap:10px}.mid{text-align:center;line-height:1.25}.mid small{display:block;color:var(--pri);font-weight:600;letter-spacing:.08em;font-size:11px}
.clock{background:var(--warn);padding:5px 14px;border-radius:99px;font-weight:600;font-variant-numeric:tabular-nums}.clock.low{background:#f6c9c9;color:#8a1414}
.prog{height:5px;background:var(--line)}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:width .45s}
#app.exam{height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));min-height:0}
.exam .top{padding:8px 18px}.exam .prog{flex:none}
.ins{flex:none;width:calc(100% - 32px);max-width:1368px;margin:8px auto;padding:9px 16px;background:var(--tint);border:1px solid var(--line);border-radius:14px;font-size:14px}
.exam main{flex:1;min-height:0;display:flex;padding:0 16px 6px;width:100%;max-width:1400px;margin:0 auto}
.pp{flex:0 0 var(--split,52%);min-width:0;overflow:auto;align-self:stretch}.qp{flex:1;min-width:0;overflow:auto;padding:2px 4px 14px}
main.solo .qp{max-width:860px;margin:0 auto}
.gut{flex:0 0 18px;cursor:col-resize;display:flex;align-items:center;justify-content:center;touch-action:none}.gut::after{content:"";width:5px;height:56px;border-radius:5px;background:var(--line);transition:.15s}.gut:hover::after{background:var(--pri)}
.exam .bar{flex:none;margin:6px auto 10px}.pop{max-height:50vh;overflow:auto;width:min(440px,92vw)}.g{width:auto;min-width:34px;padding:0 6px}
@media(max-width:780px){.exam main{flex-direction:column;padding:0 10px 4px}.pp{flex:0 0 auto;max-height:36vh}.gut{display:none}.exam .top{padding:8px 12px}.ins{width:calc(100% - 20px);font-size:13px}}
.qs{display:grid;gap:16px}.pass p{margin:.7em 0;line-height:1.75}mark{border-radius:4px;color:inherit}.my{background:var(--y)}.mg{background:var(--g)}.mb{background:var(--b)}.mp{background:var(--p)}
.qh{display:flex;gap:8px;align-items:center}.pt{margin-left:auto;font-size:12px;color:var(--mut)}.qn{font-size:11px;letter-spacing:.1em;color:var(--mut);margin:12px 0 6px}.qb p{margin:.3em 0 .6em;font-weight:500}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin:8px 0;padding:11px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;transition:.15s}.opt:hover{border-color:#e3a9bb}.opt.sel{border-color:var(--pri);background:var(--tint)}
.L{width:28px;height:28px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}.sel .L{background:var(--pri);color:#fff}.opt.tf{display:inline-flex;width:auto;margin:6px 8px 0 0}
.tok{cursor:pointer;padding:2px 3px;border-radius:6px}.tok:hover{background:var(--tint)}.tok.on{background:#cdbdf5;color:#222}
.bar{position:relative;display:flex;align-items:center;gap:4px;margin:6px auto 16px;padding:7px 8px;background:var(--card);border:1px solid var(--line);border-radius:99px;box-shadow:var(--sh);max-width:calc(100% - 20px);flex-wrap:wrap;justify-content:center}
.pop{position:absolute;bottom:calc(100% + 10px);left:50%;translate:-50% 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--sh);z-index:5;max-width:92vw;text-align:center}
.dot{display:inline-block;width:24px;height:24px;border-radius:50%;margin:0 4px;border:3px solid transparent;cursor:pointer;vertical-align:middle}.dot.act{border-color:var(--ink)}
.g{display:inline-block;width:34px;height:34px;line-height:34px;text-align:center;margin:3px;border-radius:50%;background:var(--bg);cursor:pointer}.g.d{background:#d4f0db;color:#14532d}.g.c{background:var(--pri);color:#fff}
#veil{position:fixed;inset:0;background:#1e161ab8;backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;text-align:center;z-index:9;padding:20px}#veil>div{background:var(--card);padding:28px;border-radius:var(--r);max-width:420px}
.ring{--p:0;width:130px;height:130px;border-radius:50%;margin:0 auto 12px;background:conic-gradient(var(--pri) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;position:relative}.ring::before{content:"";position:absolute;inset:11px;background:var(--card);border-radius:50%}.ring b{position:relative;font-size:28px}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}.code{font-size:40px;letter-spacing:.2em;font-weight:600;text-align:center}
.ap{flex:none;display:none;align-items:center;gap:12px;margin:0 auto 4px;width:calc(100% - 32px);max-width:700px;background:#1e1519;color:#fff;border-radius:99px;padding:8px 18px;font-size:13px}.rec{margin-bottom:12px}.rec .btn.pri{font-size:13px}

#app.shellapp{min-height:100dvh;flex-direction:row;align-items:flex-start}
.side{width:210px;flex:none;position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;padding:18px 12px;border-right:1px solid var(--line);background:var(--bg)}
.sbl{display:flex;align-items:center;gap:8px;padding:4px 8px 18px}.side nav{display:grid;gap:4px}.sbu{margin-top:auto;display:grid;gap:4px}
.ni{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:10px 12px;border-radius:14px;cursor:pointer;text-align:left;color:var(--mut);transition:.15s}.ni:hover{background:var(--tint)}.ni.on{background:var(--tint);color:var(--pri);font-weight:600}.ni i{font-style:normal;width:22px;text-align:center}
.who{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:13px;color:var(--mut)}.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.mn{flex:1;min-width:0;padding:26px 32px 40px;max-width:1180px;margin:0 auto;width:100%}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}.hd h1{margin:2px 0;font-size:28px}.eyebrow{color:var(--pri);font-weight:600;letter-spacing:.1em;font-size:11px}
.hd2{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}.lk{color:var(--pri);font-size:13px;text-decoration:none;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{border-radius:22px;padding:18px 20px;display:grid;gap:2px;min-height:150px;align-content:end}.stat i{font-style:normal;width:36px;height:36px;border-radius:12px;background:#fff;display:grid;place-items:center;margin-bottom:auto}.stat b{font-size:38px;line-height:1.1}.stat span{font-weight:500}.stat em{font-style:normal;font-size:11px;background:#ffffffb0;border-radius:99px;padding:2px 10px;justify-self:start;color:#555;margin-top:6px}
.s1{background:#e1f4e6;color:#166534}.s2{background:#fbeadd;color:#9a3d12}.s3{background:#e3eefb;color:#1d4e89}.s4{background:#ece7fb;color:#4b3aa6}
@media(prefers-color-scheme:dark){.s1{background:#1f3a27;color:#a7e3b6}.s2{background:#44301f;color:#f1bd96}.s3{background:#1f2f45;color:#a9cdf5}.s4{background:#2c2745;color:#c8bdf7}.stat em{background:#0003;color:#ddd}.stat i{background:#0004}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.rcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;display:grid;gap:4px;transition:.15s}.rcard:hover{border-color:#e3a9bb;transform:translateY(-1px)}
.mono{font-family:ui-monospace,Menlo,monospace;letter-spacing:.08em}
.pill.st-live{background:#dff3e4;color:#166534;border:0}.pill.st-lobby{background:#fdeed0;color:#8a5a00;border:0}.pill.st-open{background:#e3eefb;color:#1d4e89;border:0}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px;width:max-content;max-width:100%;margin:8px 0 14px}.tab{border:0;background:transparent;border-radius:99px;padding:7px 16px;cursor:pointer;color:var(--mut)}.tab.on{background:var(--pri);color:#fff}
.form{display:grid;gap:14px}.form label{display:grid;gap:5px;font-size:13px;color:var(--mut)}.form input[type=text],.form select{font-size:15px;color:var(--ink)}.two,.two2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.chk{display:flex!important;align-items:center;gap:8px;color:var(--ink)!important}
.acts{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.qlay{display:grid;grid-template-columns:260px 1fr;gap:14px;align-items:start}.pt1{font-weight:600;color:var(--pri);margin:10px 0 4px;font-size:13px}.st1{font-size:12px;color:var(--mut);margin:6px 0 4px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:3px 10px;cursor:pointer;font-size:12px}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.opt.ok{border-color:#2f9e5a;background:#e1f4e6;color:#14532d}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--tint)}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;margin-top:10px}.bc{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mut)}.bb{width:100%;background:linear-gradient(180deg,var(--pri2),var(--pri));border-radius:6px 6px 0 0;min-height:2px}
.sb2{display:grid;grid-template-columns:140px 1fr 44px;gap:10px;align-items:center;margin:10px 0;font-size:14px}.tr{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.tr i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2))}
.modal{position:fixed;inset:0;background:#1e161a99;backdrop-filter:blur(4px);display:grid;place-items:center;z-index:20;padding:16px}.mbox{position:relative;background:var(--card);border-radius:22px;padding:22px;max-width:520px;width:100%;max-height:90vh;overflow:auto;box-shadow:var(--sh);display:grid;gap:12px}.x{position:absolute;right:12px;top:6px;border:0;background:none;font-size:24px;cursor:pointer;color:var(--mut)}
.cbox{background:var(--bg);border-radius:16px;padding:14px;display:grid;gap:8px}.seg{display:grid;gap:8px;margin:12px 0}.seg label{border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;cursor:pointer}
.jn{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.jn .ic{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;font-size:20px}.empty{color:var(--mut);text-align:center;padding:26px;background:var(--bg);border-style:dashed}
@media(max-width:860px){#app.shellapp{flex-direction:column;align-items:stretch}.side{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;width:auto;flex-direction:row;padding:6px 8px;border-top:1px solid var(--line);border-right:0;z-index:10;background:var(--card)}.sbl,.who{display:none}.side nav,.sbu{display:flex;margin:0}.side nav{flex:1}.ni{flex-direction:column;gap:0;padding:6px 8px;font-size:11px;justify-content:center;align-items:center;text-align:center;width:auto}.sbu{margin-left:auto}.mn{padding:18px 14px 90px}.stats,.grid{grid-template-columns:1fr}.qlay,.two,.two2{grid-template-columns:1fr}.stat{min-height:110px}}
.mn.enter{animation:fadein .2s ease}@keyframes fadein{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.mn.enter .row,.mn.enter .rcard,.mn.enter .stat,.mn.enter .card{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.mn.enter .row:nth-child(2),.mn.enter .rcard:nth-child(2),.mn.enter .stat:nth-child(2){animation-delay:.04s}.mn.enter .row:nth-child(3),.mn.enter .rcard:nth-child(3),.mn.enter .stat:nth-child(3){animation-delay:.08s}.mn.enter .row:nth-child(4),.mn.enter .rcard:nth-child(4){animation-delay:.12s}.mn.enter .row:nth-child(5),.mn.enter .rcard:nth-child(5){animation-delay:.16s}.mn.enter .row:nth-child(n+6),.mn.enter .rcard:nth-child(n+6){animation-delay:.2s}
.sk{border-radius:14px;background:linear-gradient(90deg,var(--line) 25%,var(--tint) 50%,var(--line) 75%);background-size:200% 100%;animation:shim 1.2s linear infinite}@keyframes shim{to{background-position:-200% 0}}
body.busy::before{content:"";position:fixed;top:0;left:0;height:3px;width:35%;z-index:300;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:0 3px 3px 0;animation:busy 1s ease-in-out infinite}@keyframes busy{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
#toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);display:grid;gap:8px;z-index:400;pointer-events:none;justify-items:center}.toast{background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;box-shadow:var(--sh);font-size:14px;max-width:min(92vw,440px);animation:toastin .28s cubic-bezier(.2,.8,.2,1);transition:.3s}.toast.bad{background:#b0254c;color:#fff}.toast.out{opacity:0;transform:translateY(8px)}@keyframes toastin{from{opacity:0;transform:translateY(14px) scale(.96)}}
@media(max-width:860px){#toasts{bottom:86px}}
.btn.pri{box-shadow:0 6px 16px #c0305a2e}.btn.pri:hover{transform:translateY(-1px);box-shadow:0 10px 22px #c0305a45}.rcard:hover,.card.jn:hover{transform:translateY(-2px);box-shadow:var(--sh)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri2);outline-offset:1px;border-radius:10px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.ni i{display:grid;place-items:center}.ni svg{width:19px;height:19px}.stat i{color:inherit}.stat i svg{width:20px;height:20px}.logo svg{width:18px;height:18px;color:#fff}.jn .ic svg{width:22px;height:22px;color:#fff}
.rcard,.row,.stat,.card{transition:transform .18s,box-shadow .18s,border-color .18s}.row:hover{background:var(--tint)}
.orow{display:flex;gap:8px;align-items:center;margin:6px 0}.orow input[type=text]{flex:1;min-width:0}.orow b{width:20px;text-align:center}.form textarea{width:100%;font-size:15px;color:var(--ink)}@media(min-width:861px){.qed{grid-template-columns:1fr 1fr}}
