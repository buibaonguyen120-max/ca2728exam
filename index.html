<script>
// ===== Project settings (public values; safe to keep in the page) =====
const CFG={url:"https://okptwwymlluhcowtdjbv.supabase.co",key:"sb_publishable_dxKA0ixhXEpskKgUzO6Z4g_5DF-UOEg"};

// ===== Student: join =====
async function join(){const{data,error}=await SB.rpc("join_run",{p_code:$("#code").value});if(error){$("#msg").textContent=error.message;return}
 let aid=data.attempt_id;if(data.mode!="live"){const r=await SB.rpc("start_attempt",{p_run:data.run_id});if(r.error){$("#msg").textContent=r.error.message;return}aid=r.data}
 open(aid)}

 if(data.waiting){wrap(`<div class="card hero"><div class="logo big">⏳</div><h2>Waiting room</h2><p class="hint">The exam opens when your teacher starts it. Stay on this page.</p></div>`);poll=setInterval(()=>open(aid),2500);return}
 const Q=data.questions||[],pg=[],ix={};Q.forEach(q=>{const k=(q.section&&q.section.id)||q.id;if(ix[k]==null){ix[k]=pg.length;pg.push({k,sec:q.section,part:q.part,qs:[]})}pg[ix[k]].qs.push(q)});
 R={aid,Q,pg,p:0,ans:data.answers||{},hl:data.highlights||{},pend:{},v:Date.now()%1e9,tool:null,pop:"",notes:"",title:data.title,
    dl:data.deadline_at?new Date(data.deadline_at).getTime():null,off:new Date(data.server_now).getTime()-Date.now(),fs:false,on:false};
 const au=await SB.rpc("get_audio",{p_attempt:aid});R.au=au.error?{recs:[]}:au.data;R.mode=R.au.mode||"";R.audOff=R.au.server_now?new Date(R.au.server_now)-Date.now():0;R.rl={};
 await Promise.all((R.au.recs||[]).map(async r=>{const u=await SB.storage.from("recordings").createSignedUrl(r.path,14400);r.url=u.data&&u.data.signedUrl}));
 wrap(`<div class="card hero"><div class="logo big">📝</div><h1>${esc(data.title)}</h1><p class="hint">${Q.length} questions · ${R.dl?"timed":"no time limit"}. Notes are never saved. Leaving the window or full screen is recorded.</p><button class="btn pri lg" onclick="begin()">Enter full screen and start</button></div>`)}
function begin(){const e=document.documentElement;if(e.requestFullscreen)e.requestFullscreen().then(()=>R.fs=true).catch(()=>{});R.on=true;R.audio=new Audio();R.audio.preload="auto";R.audio.src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";R.audio.play().catch(()=>{});R.audio.addEventListener("waiting",()=>R.stall=1);R.audio.addEventListener("playing",()=>R.stall=0);R.at=setInterval(audTick,500);if(R.mode=="live")R.ap=setInterval(audPoll,2500);try{R.split=+localStorage.getItem("split")||52}catch(x){R.split=52}draw();
 R.clk=setInterval(tick,1000);R.hb=setInterval(()=>SB.rpc("heartbeat",{p_attempt:R.aid,p_position:R.p}),8000);window.addEventListener("online",flush)}
function left(){return R.dl?Math.max(0,Math.round((R.dl-(Date.now()+R.off))/1000)):null}
function tick(){const l=left(),c=$("#clk");if(l==null){if(c)c.textContent="No limit";return}if(c){c.textContent="⏱ "+pr(Math.floor(l/60))+":"+pr(l%60);c.className="clock"+(l<60?" low":"")}if(l<=0)finish()}
const nq=q=>R.Q.indexOf(q)+1;

const fmt=t=>{t=Math.max(0,Math.round(t||0));return Math.floor(t/60)+":"+pr(t%60)};
function rpos(r){const now=Date.now()+R.audOff;if(R.mode=="live")return r.state=="playing"&&r.play_started_at?(now-new Date(r.play_started_at))/1000:null;return r.my_started_at?(now-new Date(r.my_started_at))/1000:null}
function rstat(r){const p=rpos(r),d=r.duration||0;if(R.mode=="live"){if(p!=null&&p<=d+1)return"playing";return r.play_started_at?"played":"wait"}if(r.my_finished_at||(p!=null&&p>d+1))return"played";return p!=null?"playing":"ready"}
function recLine(r){const s=rstat(r);return s=="playing"?"Playing in the bar below":s=="played"?"Played":s=="ready"?`<button class="btn pri" onclick="playRec('${r.id}')">▶ Play recording (plays once)</button>`:"Your teacher will play this recording; it appears in the bar below"}
function recsFor(pg){return(R.au&&R.au.recs||[]).filter(r=>r.test_id||(r.section_id&&pg.sec&&r.section_id==pg.sec.id)||(r.part_id&&pg.part&&r.part_id==pg.part.id)||(r.question_id&&pg.qs.some(q=>q.id==r.question_id)))}

function audTick(){if(!R||!R.au||!R.on||R.starting)return;const recs=R.au.recs||[],a=R.audio;let cur=null,pos=0;
 for(const r of recs){const p=rpos(r),d=r.duration||0;if(p!=null&&p>=0&&p<=d+.5&&!r.my_finished_at){cur=r;pos=p;break}}
 recs.forEach(r=>{const e=$("#rn_"+r.id);if(e){const h=recLine(r);if(R.rl[r.id]!==h){R.rl[r.id]=h;e.innerHTML=h}}
  if(R.mode!="live"){const p=rpos(r);if(p!=null&&p>(r.duration||0)+.5&&!r.my_finished_at){r.my_finished_at=new Date().toISOString();SB.rpc("finish_play",{p_attempt:R.aid,p_recording:r.id})}}});
 const ap=$("#ap"),st=cur&&(cur.play_started_at||cur.my_started_at);
 if(!cur){if(R.cur){a.pause();R.cur=null}if(ap)ap.style.display="none";return}
 if(R.cur!=cur.id||R.cst!=st){R.cur=cur.id;R.cst=st;R.blocked=false;a.onloadedmetadata=()=>{try{a.currentTime=Math.min(rpos(cur)||0,a.duration||1e9)}catch(x){}a.play().catch(()=>{R.blocked=true})};a.src=cur.url||""}
 else if(a.readyState>1){if(Math.abs(a.currentTime-pos)>3){if(!R.stall&&Date.now()-(R.sl||0)>5000){R.sl=Date.now();SB.rpc("log_risk",{p_attempt:R.aid,p_kind:"audio_seek",p_detail:{from:Math.round(a.currentTime),to:Math.round(pos)}})}a.currentTime=pos}if(a.paused&&!R.blocked)a.play().catch(()=>{R.blocked=true})}
 if(ap){ap.style.display="flex";ap.innerHTML=`<span>🎧 ${esc(cur.title)}</span><span class="grow"><i style="display:block;height:4px;border-radius:4px;background:var(--pri);width:${Math.min(100,pos/(cur.duration||1)*100)}%"></i></span><span>${fmt(pos)} / ${fmt(cur.duration)}</span>${R.blocked?'<button class="btn pri" onclick="R.blocked=false;R.audio.play()">Tap to listen</button>':""}`}}
async function audPoll(){if(!R||!R.on)return;const{data}=await SB.rpc("get_audio",{p_attempt:R.aid});if(!data)return;R.audOff=new Date(data.server_now)-Date.now();(data.recs||[]).forEach(n=>{const r=R.au.recs.find(x=>x.id==n.id);if(r)Object.assign(r,{state:n.state,play_started_at:n.play_started_at})})}
async function playRec(id){const r=R.au.recs.find(x=>x.id==id);if(!r||!r.url)return alert("This recording is not available.");R.starting=1;R.cur=id;R.audio.onloadedmetadata=null;R.audio.src=r.url;R.audio.play().catch(()=>{});

 if(t=="word_formation"){const bank=c.bank||(q.section&&q.section.word_bank)||[];b=`<p>${fm(c.text)}</p><select onchange="wf('${id}','base',this.value)"><option value="">Base word…</option>${bank.map(w=>`<option ${a.base==w?"selected":""}>${esc(w)}</option>`).join("")}</select> <input type="text" placeholder="your form" ${inp} value="${esc(a.form||"")}" oninput="wf('${id}','form',this.value)">`}
 if(t=="error_id"){const tk=String(c.text||"").split(/\s+/),on=(a.marks||[]).flatMap(m=>m.tokens);b=`<p class="hint">Click the wrong word(s); a mistake can be more than one word.</p><p>${tk.map((w,i)=>`<span class="tok ${on.includes(i)?"on":""}" onclick="errTok('${id}',${i})">${esc(w)}</span>`).join(" ")}</p>`+(a.marks||[]).map((m,j)=>`<div>${j+1}. <s>${m.tokens.map(i=>esc(tk[i])).join(" ")}</s> → <input type="text" ${inp} value="${esc(m.correction)}" oninput="errCorr('${id}',${j},this.value)"></div>`).join("")}

function pick(id,k,multi){let a=R.ans[id]||{choices:[]},c=a.choices||[];c=multi?(c.includes(k)?c.filter(x=>x!=k):[...c,k]):[k];put(id,{choices:c},1)}

 else{const[{data:ts},{data:t2}]=await Promise.all([SB.from("tests").select("id,title,default_time_limit_min,tags,created_at,tc:test_questions(count)").is("deleted_at",null).order("created_at",{ascending:false}),SB.from("tests").select("id,title").not("deleted_at","is",null)]);items=ts||[];tr=t2||[]}
 const tags=[...new Set(items.flatMap(x=>x.tags||[]))].sort(),cnt=x=>(x.tc&&x.tc[0]&&x.tc[0].count)||0,pl=x=>(x.tags||[]).map(g=>`<span class="pill">${esc(g)}</span>`).join(" "),dg=x=>esc("|"+(x.tags||[]).join("|").toLowerCase()+"|");

  :items.map(t=>`<div class="row trw" data-t="${esc((t.title+" "+(t.tags||[]).join(" ")).toLowerCase())}" data-g="${dg(t)}" onclick="testv('${t.id}')"><span class="grow"><b>${esc(t.title)}</b> ${pl(t)}<div class="hint">${cnt(t)} questions · ${t.default_time_limit_min||"no"} min</div></span><span class="lk">Open →</span></div>`).join("");

// ===== Question editor =====
const QTYPES=[["mcq","Multiple choice (one answer)"],["mcq_multi","Multiple choice (several answers)"],["tfng","True / False / Not given"],["gap_fill","Gap fill"],["word_formation","Word formation"],["error_id","Error identification"],["sentence_transformation","Sentence rewriting (you grade)"],["essay","Essay (you grade)"]];
const DSK={mcq:"reading",mcq_multi:"reading",tfng:"reading",gap_fill:"vocab_grammar",word_formation:"vocab_grammar",error_id:"vocab_grammar",sentence_transformation:"writing",essay:"writing"};
const QX=["prompt","options","statement","text","max_words","bank","min_words"];
function qfill(d,q,k){const c=q.content||{},t=q.type;Object.assign(d,{type:t,skill:q.skill,title:q.title||"",points:q.points,ins:q.instruction||"",exp:q.explanation||"",tags:(q.tags||[]).join(", "),sec:q.section_id||""});
 d.extra=Object.fromEntries(Object.entries(c).filter(([x])=>!QX.includes(x)));
 if(t=="mcq"||t=="mcq_multi"){d.prompt=c.prompt||"";d.opts=(c.options||[]).map(o=>({text:o.text,ok:(k.correct||[]).includes(o.key)}))}
 else if(t=="tfng"){d.prompt=c.statement||"";d.tf=String(k.correct||"TRUE").toUpperCase()}
 else if(t=="gap_fill"){d.text=c.text||"";d.maxw=c.max_words||"";d.blanks={};d.cs={};Object.entries(k.blanks||{}).forEach(([n,v])=>{d.blanks[n]=(v.accept||[]).join(" | ");if(v.case_sensitive)d.cs[n]=true})}
 else if(t=="word_formation"){d.text=c.text||"";d.bank=(c.bank||[]).join(", ");d.base=k.base||"";d.forms=(k.accept||[]).join(" | ")}
 else if(t=="error_id"){d.text=c.text||"";d.errs=(k.errors||[]).map(e=>({t:(e.tokens||[]).join(","),a:(e.accept||[]).join(" | ")}));if(!d.errs.length)d.errs=[{t:"",a:""}]}
 else{d.prompt=c.prompt||"";d.minw=c.min_words||"";d.sample=k.sample||""}}
async function qed(qid,tid){VIEW="t";const d={type:"mcq",skill:"reading",title:"",points:1,ins:"",exp:"",tags:"",sec:"",extra:{},prompt:"",opts:[{text:"",ok:true},{text:"",ok:false},{text:"",ok:false}],tf:"TRUE",text:"",maxw:"",blanks:{},cs:{},bank:"",base:"",forms:"",errs:[{t:"",a:""}],sample:"",minw:""};let used=[],secs=[],tests=[];
 if(qid){const[{data:q},{data:k},{data:u}]=await Promise.all([SB.from("questions").select("*").eq("id",qid).single(),SB.from("question_keys").select("answer_key").eq("question_id",qid).maybeSingle(),SB.from("test_questions").select("test_id,tests(title)").eq("question_id",qid)]);if(!q)return alert("Question not found.");qfill(d,q,(k&&k.answer_key)||{});used=u||[]}
 if(tid){const{data:tq}=await SB.from("test_questions").select("questions(section_id,sections(id,title,word_bank,parts(title)))").eq("test_id",tid);const m={};(tq||[]).forEach(x=>{const s=x.questions&&x.questions.sections;if(s)m[s.id]=s});secs=Object.values(m)}
 else{const{data:ts}=await SB.from("tests").select("id,title").is("deleted_at",null).order("created_at",{ascending:false});tests=ts||[]}
 QE={id:qid||null,tid:tid||null,d,used,secs,tests,pa:{}};qdraw()}
function qblanksHtml(){const d=QE.d,ns=[...new Set([...String(d.text||"").matchAll(/___(\d+)___/g)].map(m=>m[1]))];return ns.length?ns.map(n=>`<label>Blank ${n}: accepted answers <span class="hint">(separate alternatives with | )</span><input type="text" class="e_acc" data-n="${n}" value="${esc(d.blanks[n]||"")}" oninput="qprev()"></label>`).join(""):`<p class="hint">No blank yet. Write ___1___ in the text, or press “Insert next blank”.</p>`}
function qtokHtml(){return String(QE.d.text||"").trim().split(/\s+/).filter(Boolean).map((w,i)=>`<span class="pill">${i}</span> ${esc(w)}`).join(" · ")}
function qblock(){const d=QE.d,t=d.type;
 if(t=="mcq"||t=="mcq_multi")return`<label>Question<textarea id="e_prompt" rows="3" oninput="qprev()">${esc(d.prompt)}</textarea></label><div class="hint">Options — tick the correct answer${t=="mcq_multi"?"s":""}. Mark a word with [[double brackets]] to underline it.</div><div>${d.opts.map((o,i)=>`<div class="orow"><b>${LET(i)}</b><input type="text" class="e_ot" value="${esc(o.text)}" oninput="qprev()"><label class="chk"><input type="checkbox" class="e_oc" ${o.ok?"checked":""} onchange="qok(${i})"> correct</label><button class="btn" onclick="qopt(${i})">✕</button></div>`).join("")}</div><div><button class="btn" onclick="qopt(-1)">+ Option</button></div>`;
 if(t=="tfng")return`<label>Statement<textarea id="e_prompt" rows="3" oninput="qprev()">${esc(d.prompt)}</textarea></label><label>Correct answer<select id="e_tf" onchange="qprev()">${["TRUE","FALSE","NOT_GIVEN"].map(x=>`<option value="${x}" ${d.tf==x?"selected":""}>${x.replace("_"," ")}</option>`).join("")}</select></label>`;
 if(t=="gap_fill")return`<label>Text <span class="hint">— write ___1___, ___2___ … where students type</span><textarea id="e_text" rows="4" oninput="qprev()" onchange="qblanks()">${esc(d.text)}</textarea></label><div class="orow"><button class="btn" onclick="qaddblank()">+ Insert next blank</button><label class="chk">Max words <input type="text" id="e_maxw" size="3" value="${esc(d.maxw)}" oninput="qprev()"></label></div><div id="e_blanks" class="form">${qblanksHtml()}</div>`;
 if(t=="word_formation")return`<label>Sentence <span class="hint">— use ___ for the gap</span><textarea id="e_text" rows="3" oninput="qprev()">${esc(d.text)}</textarea></label><label>Word bank <span class="hint">(comma separated; leave empty to use the section’s word bank)</span><input type="text" id="e_bank" value="${esc(d.bank)}" oninput="qprev()"></label><div class="two"><label>Base word (correct)<input type="text" id="e_base" value="${esc(d.base)}"></label><label>Accepted forms <span class="hint">(separate with | )</span><input type="text" id="e_forms" value="${esc(d.forms)}"></label></div>`;
 if(t=="error_id")return`<label>Text<textarea id="e_text" rows="4" oninput="qprev();qtok()">${esc(d.text)}</textarea></label><div class="hint">Word numbers (start from 0):</div><div id="e_tok" class="hint" style="line-height:2">${qtokHtml()}</div><div id="e_errs" class="form">${d.errs.map((e,i)=>`<div class="orow"><input type="text" class="e_et" placeholder="word no., e.g. 4 or 4,5" value="${esc(e.t)}" style="max-width:11em"><input type="text" class="e_ea" placeholder="accepted corrections: travelled | traveled" value="${esc(e.a)}"><button class="btn" onclick="qerr(${i})">✕</button></div>`).join("")}</div><div><button class="btn" onclick="qerr(-1)">+ Mistake</button></div>`;
 return`<label>${t=="essay"?"Task":"Sentence and instruction"}<textarea id="e_prompt" rows="5" oninput="qprev()">${esc(d.prompt)}</textarea></label>${t=="essay"?`<label>Minimum words (optional)<input type="text" id="e_minw" value="${esc(d.minw)}" oninput="qprev()"></label>`:""}<label>Model answer <span class="hint">(only you see it; you grade by hand)</span><textarea id="e_sample" rows="2">${esc(d.sample)}</textarea></label>`}
function qdraw(){const E=QE,d=E.d,sk=["reading","listening","vocab_grammar","writing"];
 const sec=E.tid?`<label>Section<select id="e_sec" onchange="qsecch()"><option value="">(no section / unchanged)</option>${E.secs.map(s=>`<option value="${s.id}" ${d.sec==s.id?"selected":""}>${esc((s.parts&&s.parts.title?s.parts.title+" › ":"")+(s.title||"Section"))}</option>`).join("")}<option value="__new" ${d.sec=="__new"?"selected":""}>+ New section…</option></select></label><div id="e_ns" class="form" style="display:${d.sec=="__new"?"grid":"none"}"><label>Section title<input type="text" id="e_nst" placeholder="e.g. Reading passage 1"></label><label>Instruction<input type="text" id="e_nsi"></label><label>Passage (optional)<textarea id="e_nsp" rows="4"></textarea></label><label>Word bank (comma separated, optional)<input type="text" id="e_nsb"></label></div>`
  :`<label>Add to test<select id="e_addt"><option value="">Library only</option>${E.tests.map(t=>`<option value="${t.id}">${esc(t.title)}</option>`).join("")}</select></label>${E.used.length?`<p class="hint">Used in: ${E.used.map(u=>esc(u.tests&&u.tests.title||"")).join(", ")}</p>`:""}`;
 page("library",`<div class="hd"><div><small class="eyebrow">${E.id?"EDIT":"NEW"} QUESTION</small><h1>${E.id?"Edit question":"New question"}</h1></div><button class="btn" onclick="qback()">← Back</button></div><div class="qlay qed"><div class="card form"><label>Question type<select id="e_type" onchange="qtype(this.value)">${QTYPES.map(x=>`<option value="${x[0]}" ${x[0]==d.type?"selected":""}>${x[1]}</option>`).join("")}</select></label><div class="two"><label>Skill<select id="e_skill">${sk.map(x=>`<option value="${x}" ${d.skill==x?"selected":""}>${SKN[x]}</option>`).join("")}</select></label><label>Points<input type="text" id="e_pts" value="${esc(d.points)}" oninput="qprev()"></label></div><div class="two"><label>Number / title (as students see it)<input type="text" id="e_title" value="${esc(d.title)}" placeholder="auto" oninput="qprev()"></label><label>Tags (comma separated)<input type="text" id="e_tags" value="${esc(d.tags)}"></label></div>${sec}<label>Instruction (optional)<input type="text" id="e_ins" value="${esc(d.ins)}"></label>${qblock()}<label>Explanation (shown with results, optional)<textarea id="e_exp" rows="2">${esc(d.exp)}</textarea></label>${E.id?`<p class="hint">Saving changes this question in every test that uses it. Challenges already created keep their own copy.</p>`:""}<div class="acts"><span>${E.id?`${E.tid?`<button class="btn" onclick="qrm()">Remove from this test</button> `:""}<button class="btn" onclick="qarch()">🗑 Delete from library</button>`:""}</span><span><button class="btn pri" onclick="qsave(false)">Save question</button>${E.id?"":` <button class="btn" onclick="qsave(true)">Save and add another</button>`}</span></div></div><div class="card"><div class="hint" style="margin-bottom:8px">Preview — as students see it</div><div id="e_pv"></div></div></div>`);qprev()}
function qcollect(){const d=QE.d,v=id=>{const e=document.getElementById(id);return e?e.value:null},g=(id,k)=>{const x=v(id);if(x!==null)d[k]=x};
 [["e_skill","skill"],["e_title","title"],["e_pts","points"],["e_ins","ins"],["e_exp","exp"],["e_tags","tags"],["e_prompt","prompt"],["e_tf","tf"],["e_text","text"],["e_maxw","maxw"],["e_bank","bank"],["e_base","base"],["e_forms","forms"],["e_sample","sample"],["e_minw","minw"],["e_sec","sec"]].forEach(x=>g(x[0],x[1]));
 const ot=[...document.querySelectorAll(".e_ot")],oc=[...document.querySelectorAll(".e_oc")];if(ot.length)d.opts=ot.map((e,i)=>({text:e.value,ok:oc[i].checked}));
 const et=[...document.querySelectorAll(".e_et")],ea=[...document.querySelectorAll(".e_ea")];if(et.length)d.errs=et.map((e,i)=>({t:e.value,a:ea[i].value}));
 document.querySelectorAll(".e_acc").forEach(e=>d.blanks[e.dataset.n]=e.value)}
function qcontent(){qcollect();const d=QE.d,t=d.type;let c={},k={};
 if(t=="mcq"||t=="mcq_multi"){const o=d.opts.filter(x=>x.text.trim());c={prompt:d.prompt,options:o.map((x,i)=>({key:LET(i),text:x.text.trim()}))};k={correct:o.map((x,i)=>x.ok?LET(i):null).filter(Boolean)}}
 else if(t=="tfng"){c={statement:d.prompt};k={correct:d.tf}}
 else if(t=="gap_fill"){const ns=[...new Set([...String(d.text).matchAll(/___(\d+)___/g)].map(m=>m[1]))],bl={};ns.forEach(n=>{bl[n]={accept:spl(d.blanks[n])};if(d.cs&&d.cs[n])bl[n].case_sensitive=true});c={text:d.text};if(parseInt(d.maxw))c.max_words=parseInt(d.maxw);k={blanks:bl}}
 else if(t=="word_formation"){c={text:d.text};const b=String(d.bank).split(",").map(x=>x.trim()).filter(Boolean);if(b.length)c.bank=b;k={base:String(d.base).trim(),accept:spl(d.forms)}}
 else if(t=="error_id"){c={text:String(d.text).trim()};k={errors:d.errs.filter(e=>e.t.trim()||e.a.trim()).map(e=>({tokens:e.t.split(",").map(x=>parseInt(x)).filter(x=>!isNaN(x)).sort((a,b)=>a-b),accept:spl(e.a)}))}}
 else{c={prompt:d.prompt};if(t=="essay"&&parseInt(d.minw))c.min_words=parseInt(d.minw);k=String(d.sample).trim()?{sample:String(d.sample).trim()}:{}}
 return{c:Object.assign({},d.extra||{},c),k}}
function qcheck(b){const d=QE.d,t=d.type,c=b.c,k=b.k;if(!(parseFloat(d.points)>0))return"Points must be greater than 0.";
 if(t=="mcq"||t=="mcq_multi"){if(!d.prompt.trim())return"Write the question.";if(c.options.length<2)return"Add at least two options.";if(!k.correct.length)return"Tick the correct option.";if(t=="mcq"&&k.correct.length>1)return"Tick only one option, or use the “several answers” type."}
 else if(t=="tfng"){if(!d.prompt.trim())return"Write the statement."}
 else if(t=="gap_fill"){const ns=Object.keys(k.blanks);if(!ns.length)return"Put at least one blank like ___1___ in the text.";const n=ns.find(x=>!k.blanks[x].accept.length);if(n)return"Blank "+n+" needs at least one accepted answer."}
 else if(t=="word_formation"){if(!d.text.trim())return"Write the sentence.";if(!k.base||!k.accept.length)return"Give the base word and at least one accepted form."}
 else if(t=="error_id"){if(!d.text.trim())return"Write the text.";if(!k.errors.length)return"Add at least one mistake.";const tn=c.text.split(/\s+/).length;for(const e of k.errors){if(!e.tokens.length||e.tokens.some(x=>x<0||x>=tn))return"Word numbers must be between 0 and "+(tn-1)+".";if(!e.accept.length)return"Each mistake needs at least one accepted correction."}}
 else if(!d.prompt.trim())return"Write the task.";return""}
function qprev(){const box=$("#e_pv");if(!box||!QE)return;const b=qcontent(),d=QE.d,s=QE.secs.find(x=>x.id==d.sec),q={id:"pv",type:d.type,skill:d.skill,points:parseFloat(d.points)||1,title:d.title||"1",content:b.c,section:s?{word_bank:s.word_bank}:null};
 R={prev:1,pvMode:"editor",Q:[q],ans:QE.pa,pend:{},hl:{},on:false};box.innerHTML=card(q)}
function qtype(v){qcollect();QE.d.type=v;if(!QE.id)QE.d.skill=DSK[v];QE.pa={};qdraw()}
function qok(i){if(QE.d.type=="mcq")document.querySelectorAll(".e_oc").forEach((e,j)=>{if(j!=i)e.checked=false});qprev()}
function qopt(i){qcollect();const o=QE.d.opts;if(i<0)o.push({text:"",ok:false});else if(o.length>2)o.splice(i,1);else return alert("A question needs at least two options.");qdraw()}
function qerr(i){qcollect();const e=QE.d.errs;if(i<0)e.push({t:"",a:""});else{e.splice(i,1);if(!e.length)e.push({t:"",a:""})}qdraw()}

 const first={},gk=q=>(q.section&&q.section.id)||q.id;Q.forEach(q=>{if(first[gk(q)]==null)first[gk(q)]=q.pos});Q.sort((a,b)=>first[gk(a)]-first[gk(b)]||a.pos-b.pos);
 const pg=[],ix={};Q.forEach(q=>{const k=gk(q);if(ix[k]==null){ix[k]=pg.length;pg.push({k,sec:q.section,part:q.part,qs:[]})}pg[ix[k]].qs.push(q)});
 R={prev:1,pvMode:"exam",ptid:tid,aid:null,Q,pg,p:0,ans:{},hl:{},pend:{},notes:"",title:t&&t.title,dl:null,off:0,fs:false,on:false,au:{recs:[]},rl:{},mode:"",split:52,v:0};draw()}

async function qtab(id){const{data:tq}=await SB.from("test_questions").select("position,q:questions(id,title,type,skill,points,content,section_id,sections(id,title,instruction,parts(id,title)))").eq("test_id",id).order("position");QT=id;QP=(tq||[]).map(x=>x.q);const tree=[],pi={},si={};
 QP.forEach(q=>{const s=q.sections,p=s&&s.parts,pk=p?p.id:"-",sk=s?s.id:"-";if(!pi[pk]){pi[pk]={t:p?p.title:"",secs:[]};tree.push(pi[pk])}if(!si[sk]){si[sk]={t:s?s.title:"",qs:[]};pi[pk].secs.push(si[sk])}si[sk].qs.push(q)});

async function qsel(qid){document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c.id=="qc_"+qid));const q=QP.find(x=>x.id==qid),{data:k}=await SB.from("question_keys").select("answer_key").eq("question_id",qid).single(),key=(k&&k.answer_key)||{},c=q.content||{};let b="";

async function rload(id){const{data:r}=await SB.from("runs").select("*").eq("id",id).single();if(!r)return;
 const{data:at}=await SB.from("attempts").select("id,status,current_position,points_earned,points_possible,provisional,counted,attempt_no,last_seen_at,started_at,submitted_at,student_id,guest_name,profiles(full_name)").eq("run_id",id).is("deleted_at",null).order("started_at"),ids=(at||[]).map(a=>a.id);
 let rk=[],an=[],ra=null;if(ids.length){rk=(await SB.from("risk_events").select("attempt_id,kind").in("attempt_id",ids)).data||[];an=(await SB.from("answers").select("attempt_id,question_id,points").in("attempt_id",ids).is("deleted_at",null).limit(5000)).data||[]}

 $("#rh").textContent=r.snapshot.title;const avg=cn.filter(a=>a.status!="in_progress"&&a.points_possible>0).map(a=>a.points_earned/a.points_possible*100),av=avg.length?Math.round(avg.reduce((x,y)=>x+y,0)/avg.length):0,ans=at.length&&Q.length?Math.round(an.length/(at.length*Q.length)*100):0;
 $("#rcards").innerHTML=`<div class="stat s3"><i>${ic("chart")}</i><b>${at.length}</b><span>Participants</span><em>${new Date(r.created_at).toLocaleDateString()}</em></div><div class="stat s1"><i>${ic("cap")}</i><b>${av}%</b><span>Average score</span><em>of ${Q.reduce((s,q)=>s+q.points,0)} points</em></div><div class="stat s4"><i>${ic("check")}</i><b>${sub.length}/${at.length}</b><span>Submitted</span><em>${ans}% answered</em></div>`;
 const bins=Array(10).fill(0);avg.forEach(p=>bins[Math.min(9,Math.floor(p/10))]++);const mx=Math.max(1,...bins);
 $("#dist").innerHTML=`<div class="bars">${bins.map((n,i)=>`<div class="bc"><em style="font-style:normal">${n||""}</em><div class="bb" style="height:${n/mx*80}%"></div><span>${i*10}</span></div>`).join("")}</div>`;
 const sk={};Q.forEach(q=>{const s=sk[q.skill]=sk[q.skill]||[0,0];cn.forEach(a=>{const x=an.find(y=>y.attempt_id==a.id&&y.question_id==q.id);s[0]+=x&&x.points?+x.points:0;s[1]+=q.points})});

 else $("#rtab").innerHTML=`<table><tr><th>#</th><th>Question</th><th>Skill</th><th>Correct</th><th>Accuracy</th></tr>${Q.map(q=>{const rs=cn.map(a=>an.find(y=>y.attempt_id==a.id&&y.question_id==q.id)),ok=rs.filter(x=>x&&+x.points>=q.points-.001).length,sc=rs.reduce((s,x)=>s+(x&&x.points?+x.points:0),0),tot=cn.length*q.points,c=q.content||{};return`<tr><td>${esc(q.title)}</td><td>${esc(String(c.prompt||c.text||c.statement||"").slice(0,70))}</td><td>${SKN[q.skill]||q.skill}</td><td>${ok}/${cn.length}</td><td><span class="pill">${tot?Math.round(sc/tot*100):0}%</span></td></tr>`}).join("")}</table>`;

 return`<div class="top2"><span class="pill st-${r.status}">${stl(r)}</span><span class="hint">${n} joined · ${on} online · ${sub} submitted</span></div><h3 style="margin:0">${esc(r.snapshot.title)}</h3><div class="cbox"><div class="hint">Join code</div><div class="code">${r.join_code}</div><div><button class="btn" onclick="cp('${r.join_code}')">Copy code</button><button class="btn" onclick="cp('${link}')">Copy link</button></div></div><div class="cbox"><div class="top2"><b>Time limit</b><span>${r.mode=="live"?"":"per attempt · "}${r.time_limit_min?r.time_limit_min+" min":"No limit"}</span></div>${rem}<div><button class="btn" onclick="lim('${id}')">Change</button>${r.time_limit_min?`<button class="btn" onclick="act('set_time_limit','${id}',${r.time_limit_min+5})">+5 min</button>`:""}<button class="btn" onclick="act('set_time_limit','${id}',null)">Remove</button></div></div>${r.mode!="live"?`<div class="cbox"><div class="top2"><b>Due date</b><span>${r.due_at?new Date(r.due_at).toLocaleString():"No due date"}</span></div><div><button class="btn" onclick="due('${id}')">Set due date</button></div></div>`:""}${ra&&(ra.recs||[]).length?`<div class="cbox"><b>Recordings</b>${ra.recs.map(x=>recRow(x,ra,id)).join("")}</div>`:""}<div class="acts">${r.status=="lobby"?`<button class="btn pri" onclick="act('start_run','${id}')">Start challenge</button>`:"<span></span>"}${r.status!="ended"?`<button class="btn" onclick="if(confirm('End for everyone? This cannot be undone.'))act('end_run','${id}')">End challenge</button>`:""}</div>`}
async function act(fn,id,m){const a=fn=="set_time_limit"?{p_run:id,p_minutes:m}:{p_run:id},{error}=await SB.rpc(fn,a);if(error)alert(error.message);rload(id)}
function lim(id){const v=prompt("Time limit in minutes");if(v===null||v==="")return;act("set_time_limit",id,parseInt(v))}
async function due(id){const v=prompt("Due date and time, e.g. 2026-11-20 23:59 (leave empty to remove)");if(v===null)return;const d=v?new Date(v.replace(" ","T")):null;if(d&&isNaN(d))return alert("Could not read that date.");const{error}=await SB.rpc("set_due",{p_run:id,p_due:d?d.toISOString():null});if(error)alert(error.message);rload(id)}
async function act2(fn,run,rec){const{error}=await SB.rpc(fn,{p_run:run,p_recording:rec});if(error)alert(error.message);rload(run)}
function csv(){if(!RD)return;const{r,at,rk,an}=RD,rows=[["Student","Attempt","Counted","Status","Points","Possible","Percent","Answered","Risk","Seconds","Submitted"]].concat(at.map(a=>[a.profiles&&a.profiles.full_name||a.guest_name||"Guest",a.attempt_no,a.counted?"yes":"",a.status,a.points_earned,a.points_possible,a.points_possible?Math.round(a.points_earned/a.points_possible*100):0,an.filter(x=>x.attempt_id==a.id).length,rk.filter(x=>x.attempt_id==a.id).length,a.submitted_at?Math.round((new Date(a.submitted_at)-new Date(a.started_at))/1000):"",a.submitted_at||""])),s=rows.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n"),l=document.createElement("a");l.href=URL.createObjectURL(new Blob(["\ufeff"+s],{type:"text/csv"}));l.download=(r.snapshot.title||"results").replace(/[^\w\-]+/g,"_")+".csv";l.click()}
// ----- Teacher: one student's attempt
async function attv(aid,rid){clearInterval(poll);const[{data:r},{data:an},{data:rk},{data:a}]=await Promise.all([SB.from("runs").select("snapshot").eq("id",rid).single(),SB.from("answers").select("question_id,response,points,comment").eq("attempt_id",aid),SB.from("risk_events").select("kind,detail,occurred_at").eq("attempt_id",aid).order("occurred_at"),SB.from("attempts").select("points_earned,points_possible,provisional,guest_name,profiles(full_name)").eq("id",aid).single()]);const Q=r.snapshot.questions||[];
 page("challenges",`<div class="hd"><div><small class="eyebrow">STUDENT</small><h1>${esc(a.profiles&&a.profiles.full_name||a.guest_name||"Guest")}</h1><span class="hint">${a.points_earned}/${a.points_possible} points${a.provisional?" · provisional":""}</span></div><span><button class="btn" onclick="runv('${rid}')">← Results</button><button class="btn" onclick="if(confirm('Move this attempt to the trash?'))trashAtt('${aid}','${rid}')">🗑 Trash</button></span></div><div class="card"><b>Risk</b>${(rk||[]).length?rk.map(x=>`<div class="hint">${new Date(x.occurred_at).toLocaleTimeString()} · ${x.kind}${x.kind=="audio_seek"&&x.detail?` (from ${fmt(x.detail.from)} to ${fmt(x.detail.to)})`:""}</div>`).join(""):'<p class="hint">No flags.</p>'}</div><div class="card" style="overflow:auto"><table><tr><th>#</th><th>Question</th><th>Answer</th><th>Points</th></tr>${Q.map(q=>{const x=(an||[]).find(y=>y.question_id==q.id),c=q.content||{},man=["essay","sentence_transformation"].includes(q.type);return`<tr><td>${esc(q.title)}</td><td>${esc(String(c.prompt||c.text||c.statement||"").slice(0,120))}</td><td>${esc(x?(x.response.text||JSON.stringify(x.response)):"–")}${man&&(q.key||{}).sample?`<div class="hint">Sample: ${esc(q.key.sample)}</div>`:""}</td><td>${man?`<input type="text" size="4" id="p${q.id}" value="${x&&x.points!=null?x.points:""}"> / ${q.points}<br><input type="text" id="c${q.id}" placeholder="comment" value="${esc(x&&x.comment||"")}"><br><button class="btn pri" onclick="sg('${aid}','${q.id}')">Save</button>`:(x&&x.points!=null?x.points+" / "+q.points:"0 / "+q.points)}</td></tr>`}).join("")}</table></div>`)}
async function sg(aid,qid){const{error}=await SB.rpc("grade_answer",{p_attempt:aid,p_question:qid,p_points:parseFloat($("#p"+qid).value),p_comment:$("#c"+qid).value});alert(error?error.message:"Saved")}
async function trashAtt(aid,rid){const{error}=await SB.rpc("trash_attempt",{p_attempt:aid});if(error)alert(error.message);runv(rid)}

// ----- Teacher: recordings of a test
async function aud(tid){const[{data:t},{data:tq},{data:rc}]=await Promise.all([SB.from("tests").select("title").eq("id",tid).single(),SB.from("test_questions").select("questions(section_id,part_id,sections(id,title,parts(id,title)))").eq("test_id",tid),SB.rpc("list_test_recordings",{p_test:tid})]);
 const secs={},parts={};(tq||[]).forEach(x=>{const s=x.questions&&x.questions.sections;if(s){secs[s.id]=s;if(s.parts)parts[s.parts.id]=s.parts}});
 const lab=r=>r.scope=="test"?"Whole test":r.scope=="section"?"Section: "+((secs[r.section_id]||{}).title||""):r.scope=="part"?"Part: "+((parts[r.part_id]||{}).title||""):"Question";
 page("library",`<div class="hd"><div><small class="eyebrow">RECORDINGS</small><h1>${esc(t&&t.title)}</h1></div><button class="btn" onclick="testv('${tid}')">← Back to test</button></div><div class="card"><h2 style="margin:0 0 6px">Recordings</h2>${(rc||[]).map(r=>`<div class="row" style="cursor:default"><span class="grow">${esc(r.title)} <span class="hint">${lab(r)} · ${fmt(r.duration_sec)}</span></span><button class="btn" onclick="if(confirm('Delete this recording?'))delRec('${r.id}','${tid}')">🗑</button></div>`).join("")||'<p class="hint">No recordings yet.</p>'}</div><div class="card form" style="margin-top:14px"><h2 style="margin:0">Add a recording</h2><p class="hint">MP3, M4A, WAV, OGG or WebM, up to 60 MB. Students cannot pause or rewind.</p><input type="file" id="rf" accept="audio/*"><label>Title<input type="text" id="rt"></label><label>Plays for<select id="rs"><option value="test:">Whole test</option>${Object.values(parts).map(p=>`<option value="part:${p.id}">Part: ${esc(p.title)}</option>`).join("")}${Object.values(secs).map(s=>`<option value="section:${s.id}">Section: ${esc(s.title)}</option>`).join("")}</select></label><label>Transcript (teachers only, optional)<textarea id="rx" rows="3"></textarea></label><div class="acts"><span></span><button class="btn pri" onclick="addRec('${tid}')">Upload and add</button></div></div>`)}
async function addRec(tid){const f=$("#rf").files[0];if(!f)return alert("Choose an audio file first.");if(f.size>62914560)return alert("The file is larger than 60 MB.");
 const dur=await new Promise(res=>{const a=new Audio();a.preload="metadata";a.src=URL.createObjectURL(f);a.onloadedmetadata=()=>res(a.duration);a.onerror=()=>res(null)});if(!dur||!isFinite(dur))return alert("Could not read this audio file.");
 const path=crypto.randomUUID()+"/"+f.name.replace(/[^\w.\-]+/g,"_"),up=await SB.storage.from("recordings").upload(path,f,{contentType:f.type||"audio/mpeg"});if(up.error)return alert(up.error.message);
 const[sc,tg]=$("#rs").value.split(":"),{error}=await SB.rpc("add_recording",{p_test:tid,p_title:$("#rt").value||f.name,p_path:path,p_mime:f.type||null,p_size:f.size,p_duration:dur,p_transcript:$("#rx").value||null,p_scope:sc,p_target:tg||null});if(error)return alert(error.message);aud(tid)}
async function delRec(id,tid){const{error}=await SB.rpc("delete_recording",{p_recording:id});if(error)alert(error.message);aud(tid)}
boot();
</script></body></html>
