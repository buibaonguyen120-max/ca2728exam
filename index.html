function qfill(d,q,k){const c=q.content||{},t=q.type;Object.assign(d,{type:t,skill:q.skill,title:q.title||"",points:q.points,ins:q.instruction||"",exp:q.explanation||"",tags:(q.tags||[]).join(", "),sec:q.section_id||""});

 else if(t=="gap_fill"){d.text=c.text||"";d.maxw=c.max_words||"";d.blanks={};d.cs={};Object.entries(k.blanks||{}).forEach(([n,v])=>{d.blanks[n]=(v.accept||[]).join(" | ");if(v.case_sensitive)d.cs[n]=true})}

 else if(t=="error_id"){d.text=c.text||"";d.errs=(k.errors||[]).map(e=>({t:(e.tokens||[]).join(","),a:(e.accept||[]).join(" | ")}));if(!d.errs.length)d.errs=[{t:"",a:""}]}

 if(qid){const[{data:q},{data:k},{data:u}]=await Promise.all([SB.from("questions").select("*").eq("id",qid).single(),SB.from("question_keys").select("answer_key").eq("question_id",qid).maybeSingle(),SB.from("test_questions").select("test_id,tests(title)").eq("question_id",qid)]);if(!q)return alert("Question not found.");qfill(d,q,(k&&k.answer_key)||{});used=u||[]}
 if(tid){const{data:tq}=await SB.from("test_questions").select("questions(section_id,sections(id,title,word_bank,parts(title)))").eq("test_id",tid);const m={};(tq||[]).forEach(x=>{const s=x.questions&&x.questions.sections;if(s)m[s.id]=s});secs=Object.values(m)}

function qblanksHtml(){const d=QE.d,ns=[...new Set([...String(d.text||"").matchAll(/___(\d+)___/g)].map(m=>m[1]))];return ns.length?ns.map(n=>`<label>Blank ${n}: accepted answers <span class="hint">(separate alternatives with | )</span><input type="text" class="e_acc" data-n="${n}" value="${esc(d.blanks[n]||"")}" oninput="qprev()"></label>`).join(""):`<p class="hint">No blank yet. Write ___1___ in the text, or press “Insert next blank”.</p>`}

function qblock(){const d=QE.d,t=d.type;
 if(t=="mcq"||t=="mcq_multi")return`<label>Question<textarea id="e_prompt" rows="3" oninput="qprev()">${esc(d.prompt)}</textarea></label><div class="hint">Options — tick the correct answer${t=="mcq_multi"?"s":""}. Mark a word with [[double brackets]] to underline it.</div><div>${d.opts.map((o,i)=>`<div class="orow"><b>${LET(i)}</b><input type="text" class="e_ot" value="${esc(o.text)}" oninput="qprev()"><label class="chk"><input type="checkbox" class="e_oc" ${o.ok?"checked":""} onchange="qok(${i})"> correct</label><button class="btn" onclick="qopt(${i})">✕</button></div>`).join("")}</div><div><button class="btn" onclick="qopt(-1)">+ Option</button></div>`;

 if(t=="gap_fill")return`<label>Text <span class="hint">— write ___1___, ___2___ … where students type</span><textarea id="e_text" rows="4" oninput="qprev()" onchange="qblanks()">${esc(d.text)}</textarea></label><div class="orow"><button class="btn" onclick="qaddblank()">+ Insert next blank</button><label class="chk">Max words <input type="text" id="e_maxw" size="3" value="${esc(d.maxw)}" oninput="qprev()"></label></div><div id="e_blanks" class="form">${qblanksHtml()}</div>`;

 if(t=="error_id")return`<label>Text<textarea id="e_text" rows="4" oninput="qprev();qtok()">${esc(d.text)}</textarea></label><div class="hint">Word numbers (start from 0):</div><div id="e_tok" class="hint" style="line-height:2">${qtokHtml()}</div><div id="e_errs" class="form">${d.errs.map((e,i)=>`<div class="orow"><input type="text" class="e_et" placeholder="word no., e.g. 4 or 4,5" value="${esc(e.t)}" style="max-width:11em"><input type="text" class="e_ea" placeholder="accepted corrections: travelled | traveled" value="${esc(e.a)}"><button class="btn" onclick="qerr(${i})">✕</button></div>`).join("")}</div><div><button class="btn" onclick="qerr(-1)">+ Mistake</button></div>`;
 if(t=="paragraph_gap")return`<label>Text <span class="hint">— write [1], [2] … where a paragraph belongs</span><textarea id="e_text" rows="6" oninput="qprev()" onchange="qslots()">${esc(d.text)}</textarea></label><div class="hint">Paragraphs (letters are automatic; you may add extra ones that fit no gap)</div><div>${d.pgs.map((p,i)=>`<div class="orow"><b>${LET(i)}</b><textarea class="e_pt" rows="2" oninput="qprev()">${esc(p.text)}</textarea><button class="btn" onclick="qpg(${i})">✕</button></div>`).join("")}</div><div><button class="btn" onclick="qpg(-1)">+ Paragraph</button></div><div id="e_slots" class="form" style="margin-top:12px">${qslotsHtml()}</div>`;
 if(t=="matching")return`<label>Instruction (optional)<input type="text" id="e_prompt" value="${esc(d.prompt)}" oninput="qprev()"></label><div class="hint">Options (letters are automatic)</div><div>${d.mopts.map((o,i)=>`<div class="orow"><b>${LET(i)}</b><input type="text" class="e_mo" value="${esc(o.text)}" oninput="qprev()"><button class="btn" onclick="qmo(${i})">✕</button></div>`).join("")}</div><div><button class="btn" onclick="qmo(-1)">+ Option</button></div><div class="hint" style="margin-top:12px">Items — choose the correct option for each</div><div>${d.items.map((it,i)=>`<div class="orow"><b>${esc(it.n)}</b><input type="text" class="e_it" data-n="${esc(it.n)}" value="${esc(it.text)}" oninput="qprev()"><select class="e_ia" onchange="qprev()"><option value="">—</option>${d.mopts.map((o,j)=>`<option value="${LET(j)}" ${it.ans==LET(j)?"selected":""}>${LET(j)}</option>`).join("")}</select><button class="btn" onclick="qit(${i})">✕</button></div>`).join("")}</div><div><button class="btn" onclick="qit(-1)">+ Item</button></div>`;
 return`<label>${t=="essay"?"Task":"Sentence and instruction"}<textarea id="e_prompt" rows="5" oninput="qprev()">${esc(d.prompt)}</textarea></label>${t=="essay"?`<label>Minimum words (optional)<input type="text" id="e_minw" value="${esc(d.minw)}" oninput="qprev()"></label>`:""}<label>Model answer <span class="hint">(only you see it; you grade by hand)</span><textarea id="e_sample" rows="2">${esc(d.sample)}</textarea></label>`}
function qdraw(){const E=QE,d=E.d,sk=["reading","listening","vocab_grammar","writing"];

function qcollect(){const d=QE.d,v=id=>{const e=document.getElementById(id);return e?e.value:null},g=(id,k)=>{const x=v(id);if(x!==null)d[k]=x};
 [["e_skill","skill"],["e_title","title"],["e_pts","points"],["e_ins","ins"],["e_exp","exp"],["e_tags","tags"],["e_prompt","prompt"],["e_tf","tf"],["e_text","text"],["e_maxw","maxw"],["e_bank","bank"],["e_base","base"],["e_forms","forms"],["e_sample","sample"],["e_minw","minw"],["e_sec","sec"]].forEach(x=>g(x[0],x[1]));
 const ot=[...document.querySelectorAll(".e_ot")],oc=[...document.querySelectorAll(".e_oc")];if(ot.length)d.opts=ot.map((e,i)=>({text:e.value,ok:oc[i].checked}));

function qcontent(){qcollect();const d=QE.d,t=d.type;let c={},k={};
 if(t=="mcq"||t=="mcq_multi"){const o=d.opts.filter(x=>x.text.trim());c={prompt:d.prompt,options:o.map((x,i)=>({key:LET(i),text:x.text.trim()}))};k={correct:o.map((x,i)=>x.ok?LET(i):null).filter(Boolean)}}

 else if(t=="paragraph_gap"){const ns=[...new Set([...String(d.text).matchAll(/\[(\d+)\]/g)].map(m=>m[1]))];c={text:d.text,paragraphs:d.pgs.map((p,i)=>({key:LET(i),text:p.text.trim()}))};k={slots:Object.fromEntries(ns.filter(n=>d.pslots[n]).map(n=>[n,d.pslots[n]]))}}
 else if(t=="matching"){c={items:d.items.map(it=>({n:String(it.n),text:it.text.trim()})),options:d.mopts.map((o,i)=>({key:LET(i),text:o.text.trim()}))};if(String(d.prompt).trim())c.prompt=d.prompt;k={slots:Object.fromEntries(d.items.filter(it=>it.ans).map(it=>[String(it.n),it.ans]))}}

.sq{display:grid;grid-template-columns:70px 1fr 100px minmax(80px,1fr) 48px;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.sq small{color:var(--mut)}
.mx{overflow:auto}.mx table{min-width:max-content}
.mx th{font-size:12px;max-width:140px}
.mx tr.avg td{font-weight:600;border-top:2px solid var(--line)}
.sbadge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}
.sbadge.full{background:var(--sf)}.sbadge.part{background:var(--sp)}.sbadge.wrong{background:var(--sw)}.sbadge.blank{background:var(--sb)}.sbadge.pend{background:var(--sg)}
.t-full{color:var(--sf)}.t-wrong{color:var(--sw)}.t-part{color:var(--sp)}
.sst{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.sst div{padding:10px;border-radius:12px;background:var(--bg)}
.sst b{font-size:22px;display:block}.sst small{color:var(--mut)}
.dr{display:grid;grid-template-columns:minmax(90px,1.2fr) 1fr 90px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.dr.ok .tr i{background:var(--sf)}.dr.ok .L{font-weight:600}
.dr .L{overflow:hidden;text-overflow:ellipsis}
.atc{display:grid;grid-template-columns:minmax(120px,1.4fr) 1fr 48px 48px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
tr[hidden],.rvq[hidden],.rvs[hidden]{display:none}
.rvs{margin:18px 0 8px;padding:12px 14px;border-radius:14px;background:var(--tint)}.rvs details{margin-top:6px}
.rvpas{max-height:260px;overflow:auto;margin-top:6px;font-size:14px;line-height:1.55}
.rvq{border:1px solid var(--line);border-left:4px solid var(--sb);border-radius:14px;padding:12px 14px;margin:10px 0;background:var(--card)}
.rvq.full{border-left-color:var(--sf)}.rvq.part{border-left-color:var(--sp)}.rvq.wrong{border-left-color:var(--sw)}.rvq.pend{border-left-color:var(--sg)}
.rvh{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.rvpt{font-weight:600}
.rvb{margin-top:8px}.rvb p{margin:0 0 8px}
.rvo{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:12px;margin:6px 0}
.rvo .L{font-weight:700;min-width:22px;white-space:nowrap}.rvo.hintk .L{min-width:0}.rvo.hintk.kc .L{background:var(--sf);color:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--sf) 25%,transparent)}
.rvo.ok{border-color:var(--sf);background:color-mix(in srgb,var(--sf) 14%,transparent)}
.rvo.bad{border-color:var(--sw);background:color-mix(in srgb,var(--sw) 14%,transparent)}
.rvt{font-style:normal;font-size:12px;font-weight:600;white-space:nowrap}
.rvo.ok .rvt{color:var(--sf)}.rvo.bad .rvt{color:var(--sw)}
.rvg{display:inline-block;padding:1px 8px;margin:0 3px;border-radius:8px;font-weight:600;border:1px solid transparent}
.rvg.ok{background:color-mix(in srgb,var(--sf) 16%,transparent);color:var(--sf);border-color:var(--sf)}
.rvg.bad{background:color-mix(in srgb,var(--sw) 16%,transparent);color:var(--sw);border-color:var(--sw)}
.rvg.blank{background:var(--bg);color:var(--mut);font-weight:400;border-color:var(--line)}
.rvk{font-size:13px;color:var(--sf);font-weight:600}.rvn{color:var(--mut);font-size:11px;margin-left:2px}
.rvt2.ok{background:color-mix(in srgb,var(--sf) 22%,transparent);border-radius:6px}.rvt2.bad{background:color-mix(in srgb,var(--sw) 22%,transparent);border-radius:6px;text-decoration:line-through}.rvt2.miss{outline:2px dashed var(--sp);border-radius:6px}
.rvtx{white-space:pre-wrap;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);margin-top:6px}
.rvgr{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1}

@media(max-width:600px){
 .sg>summary{grid-template-columns:1fr auto}.sg>summary .sgn{order:1}.sg>summary .pill{order:2}.sg>summary small{order:3;grid-column:1/-1}.sg>summary .sbar{order:4;grid-column:1/-1}
 .sq{grid-template-columns:1fr 48px}.sq .sbar,.sq small,.sq .cr{grid-column:1/-1}
 .sst{grid-template-columns:repeat(3,1fr)}.dr{grid-template-columns:1fr 70px}.dr .tr{grid-column:1/-1;order:3}
 .atc{grid-template-columns:1fr 48px}.atc .tr{grid-column:1/-1;order:3}.atc span:last-child{display:none}}

<script id="stats-js">
const TYN={mcq:"Multiple choice",mcq_multi:"Multiple choice (multi)",tfng:"True / False / Not given",gap_fill:"Gap fill",word_formation:"Word formation",error_id:"Error identification",matching:"Matching",paragraph_gap:"Paragraph gap",essay:"Essay",sentence_transformation:"Sentence transformation"},
MAN=["essay","sentence_transformation"],SBL={full:"Correct",part:"Partial",wrong:"Wrong",blank:"Blank",pend:"To grade"},

const ptl=q=>q.part&&(q.part.title||q.part.name)||"",

function agg(Qs,ats,idx){const o={n:Qs.length,pts:0,got:0,cells:0,full:0,part:0,wrong:0,blank:0,pend:0};
 Qs.forEach(q=>ats.forEach(a=>{const x=idx.get(a.id+"|"+q.id),s=cst(q,x);o.cells++;o[s]++;if(s=="pend")return;o.pts+=q.points;o.got+=x&&x.points!=null?(+x.points||0):0}));return o}

 sleg=()=>`<div class="sleg">${SK5.map(k=>`<span><i class="s-${k}"></i>${SBL[k]}</span>`).join("")}</div>`,

function keyList(q){const k=q.key;if(k==null)return[];if(typeof k=="string")return[k];if(k.correct!=null)return acc(k.correct).map(v=>String(v).toUpperCase()==String(v)&&q.type=="tfng"?String(v).toUpperCase():v);if(Array.isArray(k.choices))return k.choices;if(k.choice!=null)return[k.choice];return[]}
function ktxt(q){try{const k=q.key;if(k==null)return"";if(typeof k=="string")return k;const j=v=>acc(v).join(" / ");
 if(k.correct!=null)return acc(k.correct).map(v=>String(v).replace("_"," ")).join(", ");
 if(Array.isArray(k.choices))return k.choices.join(", ");if(k.choice!=null)return String(k.choice).replace("_"," ");
 if(k.blanks&&typeof k.blanks=="object")return Object.entries(k.blanks).map(([n,v])=>n+": "+j(v&&v.accept!=null?v.accept:v)).join(" · ");
 if(k.slots&&typeof k.slots=="object")return Object.entries(k.slots).map(([n,v])=>n+" → "+v).join(" · ");
 if(Array.isArray(k.errors))return k.errors.map(e=>(e.tokens||[]).join(",")+" → "+j(e.accept)).join(" · ");

let SD="type",SM="groups",SO=new Set(),RESP={};
function idxOf(){if(!RD)return new Map();if(!idxOf.c||idxOf.c.r!==RD.an){const m=new Map();RD.an.forEach(x=>m.set(x.attempt_id+"|"+x.question_id,x));idxOf.c={r:RD.an,m}}return idxOf.c.m}
const subOf=()=>RD.at.filter(a=>(a.counted||a.student_id==null)&&a.status!="in_progress");

function stHtml(){const{r}=RD,Q=r.snapshot.questions||[],ats=subOf(),idx=idxOf();

 const hard=Q.map(q=>{const o=agg([q],ats,idx);return{q,p:pc(o.got,o.pts),bl:Math.round(ats.filter(a=>{const x=E.m.get(a.id+"|"+q.id);return emptyR(q,x&&x.response)}).length/n*100)}}).filter(x=>x.p!=null).sort((a,b)=>a.p-b.p).slice(0,6);
 const hardH=`<div class="hardest"><b>Hardest questions</b>${hard.map(x=>`<span class="pill ${x.p<50?"lo":"md"}" title="${x.bl}% left blank">${esc(x.q.title)} · ${x.p}%</span>`).join("")}</div>`;
 return head+hardH+`<div class="top2"><span class="hint">Choice distribution and most common wrong answers.</span><button class="btn" onclick="stCsv()">Export detailed CSV</button></div>`+groups(SD,Q).map(([k,qs])=>`<div class="sgh">${esc(glab(SD,k))}</div>`+qs.map(q=>{const o=agg([q],ats,idx),p=pc(o.got,o.pts);
   return`<details class="sg" data-k="${dk(q.id)}" ontoggle="stTog(this)"${dopen(q.id)}><summary><span class="sgn">${esc(q.title)}</span><small class="hint">${esc(TYN[q.type]||q.type)}</small>${sbar(o)}${pill(p)}</summary><div class="sgb">${ktxt(q)&&!MAN.includes(q.type)?`<div class="hint" style="margin-bottom:6px">Key: ${esc(ktxt(q))}</div>`:""}${dist(q,ats,E.m)}</div></details>`}).join("")).join("")}
function drow(l,c,n,ok){return`<div class="dr ${ok?"ok":""}"><span class="L">${l}</span><div class="tr"><i style="width:${n?c/n*100:0}%"></i></div><span>${c} · ${n?Math.round(c/n*100):0}%</span></div>`}
function dist(q,ats,m){const c=q.content||{},n=ats.length,rs=ats.map(a=>m.get(a.id+"|"+q.id)),kl=keyList(q);let opts=null;
 if(q.type=="mcq"||q.type=="mcq_multi")opts=(c.options||[]).map(o=>({k:o.key,t:o.text}));else if(q.type=="tfng")opts=["TRUE","FALSE","NOT_GIVEN"].map(k=>({k,t:k.replace("_"," ")}));
 if(opts){const cnt={};let bl=0;rs.forEach(x=>{const r=x&&x.response,ch=r?(r.choices||(r.choice!=null?[r.choice]:[])):[];if(!ch.length)bl++;ch.forEach(k=>cnt[k]=(cnt[k]||0)+1)});
  return opts.map(o=>drow(esc(o.k)+" · "+esc(String(o.t).slice(0,60))+(kl.includes(o.k)?" ✓":""),cnt[o.k]||0,n,kl.includes(o.k))).join("")+(bl?drow("No answer",bl,n,false):"")}
 if(MAN.includes(q.type)){const g=rs.filter(x=>x&&x.points!=null);return`<p class="hint">Manually graded · ${g.length}/${n} graded${g.length?" · average "+(g.reduce((s,x)=>s+(+x.points||0),0)/g.length).toFixed(1)+" / "+q.points:""}</p>`}
 const w=new Map();let bl=0;rs.forEach(x=>{const s=cst(q,x);if(s=="blank"){bl++;return}if(s=="full")return;const t=rtxt(q,x.response);w.set(t,(w.get(t)||0)+1)});
 const top=[...w.entries()].sort((a,b)=>b[1]-a[1]).slice(0,6);
 return(top.length?`<div class="hint">Most common wrong answers</div>`+top.map(([t,k])=>drow(esc(String(t).slice(0,80)),k,n,false)).join(""):'<p class="hint">No wrong answers recorded.</p>')+(bl?drow("No answer",bl,n,false):"")}
async function stLoad(id){const c=stLoad.f=stLoad.f||{};if(c[id])return;c[id]=1;const ids=RD.at.map(a=>a.id),m=new Map();
 if(ids.length){const{data,error}=await SB.from("answers").select("attempt_id,question_id,response,points").in("attempt_id",ids).is("deleted_at",null).limit(5000);if(error){RESP[id]=false;c[id]=0;toast(error.message,true);statDraw(1);return}(data||[]).forEach(x=>m.set(x.attempt_id+"|"+x.question_id,x))}
 RESP[id]={m,n:RD.an.length};c[id]=0;statDraw(1)}

 const Q=r.snapshot.questions||[],rows=[["Student","Attempt","Counted","Question","Type","Part","Section","Skill","Response","Points","Max","Status"]];
 at.forEach(a=>Q.forEach(q=>{const x=E.m.get(a.id+"|"+q.id);rows.push([a.profiles&&a.profiles.full_name||a.guest_name||"Guest",a.attempt_no,a.counted?"yes":"",q.title,TYN[q.type]||q.type,ptl(q),q.section&&q.section.title||"",SKN[q.skill]||q.skill,x?rtxt(q,x.response):"",x&&x.points!=null?x.points:"",q.points,SBL[cst(q,x)]])}));
 const s=rows.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n"),l=document.createElement("a");l.href=URL.createObjectURL(new Blob(["\ufeff"+s],{type:"text/csv"}));l.download=(r.snapshot.title||"results").replace(/[^\w\-]+/g,"_")+"_detail.csv";l.click()}
function statDraw(f){const h=$("#stx");if(!h||!RD)return;let s;try{s=stHtml()}catch(e){console.error(e);s='<p class="hint">Could not build the breakdown.</p>'}if(!f&&h._h===s)return;h._h=s;h.innerHTML=s}
{const _r2=rdraw;rdraw=function(){const x=_r2.apply(this,arguments);statDraw();return x}}
const rvo=(k,t,ok,pk,bl)=>bl?`<div class="rvo hintk${ok?" kc":""}"${ok?' title="Correct answer"':""}><span class="L">${esc(k)}</span><span class="grow">${esc(t)}</span></div>`:`<div class="rvo ${ok?"ok":pk?"bad":""}${pk?" pk":""}"><span class="L">${esc(k)}</span><span class="grow">${esc(t)}</span>${pk?`<em class="rvt">${ok?"✓ Chosen":"✗ Chosen"}</em>`:ok?`<em class="rvt">Correct answer</em>`:""}</div>`,
 rvg=(v,ok)=>v==null||String(v).trim()===""?`<span class="rvg blank">blank</span>`:`<span class="rvg ${ok?"ok":"bad"}">${esc(v)}</span>`,
 rvk=l=>l.length?` <span class="rvk">→ ${esc(l.join(" / "))}</span>`:"";
function rbody(q,x){const c=q.content||{},k=q.key||{},r=x&&x.response||{},t=q.type;
 if(t=="mcq"||t=="mcq_multi"){const kc=keyList(q),ch=r.choices||(r.choice!=null?[r.choice]:[]);return`<p>${fm(c.prompt)}</p>`+(c.options||[]).map(o=>rvo(o.key,o.text,kc.includes(o.key),ch.includes(o.key),!ch.length)).join("")}
 if(t=="tfng"){const kc=[String(k.correct!=null?acc(k.correct)[0]:k.choice||"").toUpperCase()],ch=r.choice!=null?[String(r.choice).toUpperCase()]:[];return`<p>${fm(c.statement)}</p>`+["TRUE","FALSE","NOT_GIVEN"].map(o=>rvo(o.replace("_"," "),"",kc.includes(o),ch.includes(o),!ch.length)).join("")}
 if(t=="gap_fill"){const bl=r.blanks||{};return`<p>${String(c.text||"").split(/___(\d+)___/).map((p,j)=>{if(j%2==0)return fm(p);const kb=(k.blanks||{})[p]||{},ls=acc(kb.accept!=null?kb.accept:kb),v=bl[p],ok=v!=null&&String(v).trim()!==""&&ls.some(a=>nz(a,kb.case_sensitive)==nz(v,kb.case_sensitive));return`<sup class="rvn">${esc(p)}</sup>`+rvg(v,ok)+(ok?"":rvk(ls))}).join("")}</p>`}

  return`<p>${tk.map((w,i)=>`<span class="tok rvt2 ${S.has(i)&&K.has(i)?"ok":S.has(i)?"bad":K.has(i)?"miss":""}">${esc(w)}</span>`).join(" ")}</p>`+(k.errors||[]).map(e=>{const m=(r.marks||[]).find(m=>(m.tokens||[]).some(t=>(e.tokens||[]).includes(t))),ls=acc(e.accept),ok=m&&ls.some(a=>nz(a)==nz(m.correction));return`<div style="margin-top:6px"><s>${esc((e.tokens||[]).map(i=>tk[i]).join(" "))}</s> → ${m?rvg(m.correction,ok):`<span class="rvg blank">not marked</span>`}${ok?"":rvk(ls)}</div>`}).join("")}

 if(t=="paragraph_gap"){const sl=r.slots||{},ks=k.slots||{};return`<div class="pg">${String(c.text||"").split(/\[(\d+)\]/).map((p,j)=>{if(j%2==0)return fm(p);const ok=sl[p]&&sl[p]==ks[p];return`<sup class="rvn">${esc(p)}</sup>`+rvg(sl[p],ok)+(ok?"":rvk([ks[p]]))}).join("")}</div><div class="hint" style="margin:12px 0 6px">Paragraphs</div>${(c.paragraphs||[]).map(p=>`<div class="pgp"><b>${esc(p.key)}</b><span>${fm(p.text)}</span></div>`).join("")}`}
 return`<p>${fm(c.prompt||c.text||"")}</p><div class="rvtx">${x&&x.response&&x.response.text?esc(x.response.text):'<span class="hint">No answer</span>'}</div>`}
function qrev(q,x,aid){const s=cst(q,x),man=MAN.includes(q.type),pt=ptl(q),sc=q.section&&q.section.title,pts=x&&x.points!=null?x.points:(man&&x?null:0);
 return`<div class="rvq ${s}" data-st="${s}"><div class="rvh"><b>${esc(q.title)}</b><small class="hint">${esc(TYN[q.type]||q.type)}${pt||sc?" · "+esc([pt,sc].filter(Boolean).join(" › ")):""}</small><span class="grow"></span><span class="sbadge ${s}">${SBL[s]}</span><span class="rvpt">${pts==null?"–":pts} / ${q.points}</span></div><div class="rvb">${rbody(q,x)}${man&&(q.key||{}).sample?`<details style="margin-top:8px"><summary class="hint">Sample answer</summary><div class="rvtx">${esc(q.key.sample)}</div></details>`:""}</div>${man?`<div class="rvgr"><input type="text" size="4" id="p${q.id}" value="${x&&x.points!=null?x.points:""}"> / ${q.points} <input type="text" id="c${q.id}" placeholder="comment" value="${esc(x&&x.comment||"")}"> <button class="btn pri" onclick="sg('${aid}','${q.id}')">Save</button></div>`:""}</div>`}
function paper(Q,aid,idx){let last=null;return Q.map(q=>{const key=(q.part&&q.part.id||ptl(q))+"|"+(q.section&&q.section.id||""),pt=q.part||{},sc=q.section||{};let h="";
  if(key!==last){last=key;const ins=sc.instruction||pt.instruction,ps=sc.passage_md||pt.passage_md,ttl=[ptl(q),sc.title].filter(Boolean).join(" › ");h=ttl||ins||ps?`<div class="rvs">${ttl?`<b>${esc(ttl)}</b>`:""}${ins?`<div class="hint">${fm(ins)}</div>`:""}${ps?`<details><summary class="hint">Passage</summary><div class="rvpas">${fm(ps)}</div></details>`:""}</div>`:""}
  return h+qrev(q,idx.get(aid+"|"+q.id),aid)}).join("")}
function attf(s,b){document.querySelectorAll("#atq .rvq").forEach(r=>r.hidden=!(s=="all"||r.dataset.st==s));document.querySelectorAll("#atq .rvs").forEach(r=>r.hidden=s!="all");document.querySelectorAll("#atf .chip").forEach(c=>c.classList.toggle("on",c===b))}
function attInfo(Q,aid,rid,idx){const me=[{id:aid}],o=agg(Q,me,idx),p=pc(o.got,o.pts),cl=RD&&RD.r&&RD.r.id==rid?subOf().filter(a=>a.id!=aid):[],cidx=cl.length?idxOf():null;
 const dims=["type","part","section","skill"],blocks=dims.map((d,i)=>{const g=groups(d,Q);if(d!="type"&&d!="skill"&&g.length<2&&g[0]&&/^No /.test(g[0][0]))return"";
  const rows=g.map(([k,qs])=>{const a1=agg(qs,me,idx),pp=pc(a1.got,a1.pts),cc=cl.length?agg(qs,cl,cidx):null,cp=cc?pc(cc.got,cc.pts):null;return`<div class="atc"><span>${esc(glab(d,k))}<small class="hint"> ${a1.full}/${qs.length} correct</small></span>${sbar(a1)}${pill(pp)}${cl.length?`<span class="hint" title="Class average">⌀ ${cp==null?"–":cp+"%"}</span>`:""}</div>`}).join("");
  return`<details class="sg"${i<2?" open":""}><summary><span class="sgn">By ${GD[d].toLowerCase()}</span><small class="hint">${g.length} group${g.length>1?"s":""}</small><span></span><span></span></summary><div class="sgb">${rows}</div></details>`}).join("");
 return`<div class="card"><b>Summary</b><div class="sst"><div><b>${o.full}</b><small>Correct</small></div><div><b>${o.part}</b><small>Partial</small></div><div><b>${o.wrong}</b><small>Wrong</small></div><div><b>${o.blank}</b><small>Blank</small></div><div><b>${o.pend}</b><small>To grade</small></div></div>${sbar(o)}<p class="hint" style="margin-bottom:0">${p==null?"No graded points yet":p+"% of "+o.pts+" graded points"}${cl.length?" · ⌀ = class average ("+cl.length+" others)":""}</p>${sleg()}${blocks}</div>`}

<script id="dnd-js">
function errClr(id,j){const a=R.ans[id]||{},ms=(a.marks||[]).slice();ms.splice(j,1);put(id,{marks:ms},1)}
function pgPlace(id,gap,key,from){if(from===gap)return;const a=R.ans[id]||{},sl=Object.assign({},a.slots||{}),cur=sl[gap];Object.keys(sl).forEach(n=>{if(sl[n]==key)delete sl[n]});if(cur&&from)sl[from]=cur;sl[gap]=key;PGSEL=null;put(id,{slots:sl},1)}
function pgBack(id,key){const a=R.ans[id]||{},sl=Object.assign({},a.slots||{});Object.keys(sl).forEach(n=>{if(sl[n]==key)delete sl[n]});PGSEL=null;put(id,{slots:sl},1)}
let PGSEL=null;
(()=>{let D=null,sup=false;const root=e=>e.closest&&e.closest(".pg[data-q],.pgbank[data-q]");
 const clr=()=>{document.querySelectorAll(".gapb.over,.pgbank.over").forEach(x=>x.classList.remove("over"))};
 const target=(x,y)=>{const t=document.elementFromPoint(x,y);return t&&t.closest(".gapb,.pgbank")};
 document.addEventListener("pointerdown",e=>{if(e.button>0)return;const el=e.target.closest(".pgp[data-pk],.gpc[data-pk]");if(!el||e.target.closest("button")||!R)return;
  if(e.pointerType=="touch"&&!e.target.closest(".gh"))return;const r=el.closest("[data-q]");if(!r)return;const b=el.getBoundingClientRect();
  D={el,id:r.dataset.q,key:el.dataset.pk,from:el.dataset.from||null,x:e.clientX,y:e.clientY,ox:e.clientX-b.left,oy:e.clientY-b.top,w:b.width,drag:false,g:null}});
 document.addEventListener("pointermove",e=>{if(!D)return;if(!D.drag){if(Math.hypot(e.clientX-D.x,e.clientY-D.y)<6)return;D.drag=true;const g=D.el.cloneNode(true);g.classList.add("pgghost");g.classList.remove("sel","dragging");g.style.width=Math.min(D.w,420)+"px";document.body.appendChild(g);D.g=g;D.el.classList.add("dragging");document.querySelectorAll(".pg").forEach(p=>p.classList.add("armed"))}
  D.g.style.transform=`translate(${e.clientX-D.ox}px,${e.clientY-D.oy}px)`;clr();const t=target(e.clientX,e.clientY);if(t)t.classList.add("over");e.preventDefault()},{passive:false});
 const end=e=>{if(!D)return;const d=D;D=null;if(!d.drag)return;d.g.remove();d.el.classList.remove("dragging");clr();document.querySelectorAll(".pg.armed").forEach(p=>p.classList.remove("armed"));sup=true;setTimeout(()=>sup=false,0);
  const t=target(e.clientX,e.clientY);if(!t)return;if(t.classList.contains("gapb"))pgPlace(d.id,t.dataset.gap,d.key,d.from);else if(d.from)pgBack(d.id,d.key)};
 document.addEventListener("pointerup",end);document.addEventListener("pointercancel",e=>{if(D&&D.drag){D.g.remove();D.el.classList.remove("dragging");clr()}D=null});
 document.addEventListener("click",e=>{if(sup){e.stopPropagation();return}const r=root(e.target);if(!r||e.target.closest("button"))return;const id=r.dataset.q;
  const item=e.target.closest(".pgp[data-pk],.gpc[data-pk]"),gap=e.target.closest(".gapb"),bank=e.target.closest(".pgbank");
  const arm=()=>{document.querySelectorAll(".pgp.sel,.gpc.sel").forEach(x=>x.classList.remove("sel"));document.querySelectorAll(".pg").forEach(p=>p.classList.toggle("armed",!!PGSEL));if(PGSEL&&PGSEL.el)PGSEL.el.classList.add("sel")};
  if(PGSEL&&PGSEL.id==id){if(gap){pgPlace(id,gap.dataset.gap,PGSEL.key,PGSEL.from);return}if(bank&&PGSEL.from){pgBack(id,PGSEL.key);return}}
  if(item){if(PGSEL&&PGSEL.el===item)PGSEL=null;else PGSEL={id,key:item.dataset.pk,from:item.dataset.from||null,el:item};arm()}});
})();
</script>
<script id="delete-js">

 if(b){b.hidden=!n;$("#bulkn").textContent=n+" selected"}if(a){a.checked=n>0&&n==t;a.indeterminate=n>0&&n<t}}

  const k=document.querySelector('.rk[value="'+id+'"]'),row=k&&k.closest(".row"),b=row&&row.querySelector("b");

async function delRunGo(){const ids=DELQ.slice(),g=$("#delgo");if(g){g.disabled=true;g.textContent="Deleting…"}let ok=0,err=null;

   else err=r.error.message;break}
  ok++}
 SWRC={};RD=null;mclose();clearInterval(poll);
 if(err)toast(err=="off"?"Delete is not enabled in the database yet. Run delete_run.sql once in Supabase (SQL Editor).":err,true);
